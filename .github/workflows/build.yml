name: Build Motif macOS DMG

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos-dmg:
    name: Build Motif DMG (Apple Silicon)
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Motif build script
        run: bash motif_build_v12.txt

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Motif-macOS-DMG
          path: build/*.dmg
          if-no-files-found: error
