name: Build Aether Studio macOS App & DMG

'on':
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Generate Sources & Compile Apple Silicon DMG
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Developer Tools
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app

      - name: Generate Aether Studio Source Files
        run: |
          mkdir -p Sources/AetherStudio/App
          mkdir -p Sources/AetherStudio/Core
          mkdir -p Sources/AetherStudio/Models
          mkdir -p Sources/AetherStudio/Services
          mkdir -p Sources/AetherStudio/Views/Sidebar
          mkdir -p Sources/AetherStudio/Views/Chat
          mkdir -p Sources/AetherStudio/Views/Settings
          mkdir -p Sources/AetherStudio/Views/Components
          mkdir -p Sources/AetherStudio/Resources

          cat << 'EOF' > "Package.swift"
          // swift-tools-version: 5.10
          import PackageDescription
          
          let package = Package(
              name: "AetherStudio",
              platforms: [
                  .macOS(.v14)
              ],
              products: [
                  .executable(
                      name: "AetherStudio",
                      targets: ["AetherStudio"]
                  )
              ],
              targets: [
                  .executableTarget(
                      name: "AetherStudio",
                      path: "Sources/AetherStudio",
                      resources: [
                          .process("Resources")
                      ],
                      linkerSettings: [
                          .linkedFramework("SwiftUI"),
                          .linkedFramework("AppKit"),
                          .linkedFramework("UniformTypeIdentifiers"),
                          .linkedFramework("DiskArbitration"),
                          .linkedFramework("Security"),
                          .linkedFramework("CryptoKit"),
                          .linkedFramework("CoreText")
                      ]
                  )
              ]
          )
          EOF

