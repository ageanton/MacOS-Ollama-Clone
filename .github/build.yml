name: Build Motif macOS App & DMG

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: "Motif"
  DISPLAY_NAME: "Motif"
  BUNDLE_ID: "com.motif.studio.macos"
  VERSION: "11.0.0"
  BUILD_NUMBER: "1100"

jobs:
  build-macos-dmg:
    name: Compile Native Swift 6 Motif Workstation & Package DMG (macOS 15)
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Motif Build Script (motif_build.txt)
        shell: bash
        run: bash motif_build.txt

      - name: Upload Compiled DMG Installer as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Motif-macOS-AppleSilicon-DMG
          path: build/*.dmg
          retention-days: 30
