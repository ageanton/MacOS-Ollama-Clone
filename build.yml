name: Build Motif macOS App & DMG

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: "Motif"
  DISPLAY_NAME: "Motif"
  BUNDLE_ID: "com.motif.studio.macos"
  VERSION: "11.0.0"
  BUILD_NUMBER: "1100"

jobs:
  build-macos-dmg:
    name: Compile Native Swift 6 Motif Workstation & Package DMG (macOS 15)
    runs-on: macos-15

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Verify Apple Silicon Runner & Toolchain
      run: |-
        bash .github/scripts/build/step_01.sh

    - name: Create Project Directory Structure & Bundle Custom Fonts (Jakarta, 
        Inter, Open Sans, Geist)
      run: |-
        bash .github/scripts/build/step_02.sh

    - name: Generate Programmatic macOS Squircle AppIcon.icns
      run: |-
        bash .github/scripts/build/step_03.sh

    - name: Generate Package.swift
      run: |-
        bash .github/scripts/build/step_04.sh

    - name: Generate Domain Models, Dual Window/Fullscreen Typography & Model 
        Introspection Profiles (DomainModels.swift)
      run: |-
        bash .github/scripts/build/step_05.sh

    - name: Generate Stop-Safe Thinking Parser & Kernel proc_pidinfo + Metal 
        Memory Engine (ReasoningAndMemoryEngine.swift)
      run: |-
        bash .github/scripts/build/step_06.sh

    - name: Generate Thread-Safe SQLite WAL + FTS5 Search Engine, External Drive
        & Supervisor (SystemServices.swift)
      run: |-
        bash .github/scripts/build/step_07.sh
    - name: Generate Motif Workstation Store with Per-Model Memory, KV Cache 
        Reuse & Engine Fixes (WorkstationStore.swift)
      run: |-
        bash .github/scripts/build/step_08.sh

    - name: Generate Shared UI Components, Barless RAM Pill, 520pt Scroll 
        Threshold & Full H1-H6 Markdown Parser 
        (GlassAndTelemetryComponents.swift)
      run: |-
        bash .github/scripts/build/step_09.sh

    - name: Generate Sidebar Navigation with Workspace Management, Fixed Rename 
        & Trash (SidebarNavigationView.swift)
      run: |-
        bash .github/scripts/build/step_10.sh

    - name: Generate True Fullscreen Workspace, New-Chat Pre-Flight Deck, Large 
        Reply Editor & Live Total Tokens (EditorialConversationView.swift)
      run: |-
        bash .github/scripts/build/step_11.sh

    - name: Generate Persistent Composer, Unclipped Slash Palette & Per-Model 
        Saved Parameters Popover (ComposerAndInspectorViews.swift)
      run: |-
        bash .github/scripts/build/step_12.sh

    - name: Generate Inspector & Settings Modal with Custom Palettes, Thinking 
        Color & Summary Toggle (UtilityAndModalViews.swift)
      run: |-
        bash .github/scripts/build/step_13.sh

    - name: Generate True Edge-to-Edge Fullscreen Window & Crash-Free Layout 
        Root (MotifApp.swift)
      run: |-
        bash .github/scripts/build/step_14.sh

    - name: Compile Release Universal Binary with Swift 6 on macOS 15
      working-directory: Motif
      run: |-
        bash .github/scripts/build/step_15.sh

    - name: Assemble Motif Application Bundle (.app), Bundle AppIcon.icns, Clean
        Info.plist & Code Sign
      run: |-
        bash .github/scripts/build/step_16.sh

    - name: Package Compressed macOS Disk Image (.dmg) with Applications Symlink
      run: |-
        bash .github/scripts/build/step_17.sh

    - name: Upload Compiled DMG Installer as GitHub Actions Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Motif-macOS-AppleSilicon-DMG
        path: build/*.dmg
        retention-days: 30
