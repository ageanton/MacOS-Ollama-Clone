<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2620"/>
      <stop offset="100%" stop-color="#0E1612"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg)" stroke="#24332D" stroke-width="4"/>
  
  <!-- Subtle Ambient Glow -->
  <circle cx="256" cy="256" r="160" fill="url(#glow)"/>

  <!-- Orbital Rings representing local compute core & neural weights -->
  <ellipse cx="256" cy="256" rx="130" ry="60" fill="none" stroke="#2D3F37" stroke-width="5" transform="rotate(-25 256 256)"/>
  <ellipse cx="256" cy="256" rx="130" ry="60" fill="none" stroke="url(#ring)" stroke-width="6" stroke-dasharray="120 200" transform="rotate(35 256 256)"/>

  <!-- Core Nucleus representing Unified Silicon & Storage -->
  <circle cx="256" cy="256" r="32" fill="#10B981"/>
  <circle cx="256" cy="256" r="16" fill="#ECFDF5"/>

  <!-- Orbital Satellite Dots -->
  <circle cx="160" cy="180" r="8" fill="#34D399"/>
  <circle cx="360" cy="310" r="10" fill="#6EE7B7"/>
</svg>
